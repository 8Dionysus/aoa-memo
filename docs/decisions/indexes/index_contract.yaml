schema_version: aoa_memo_decision_index_contract_v1
authority: docs/decisions/AGENTS.md
source_records: docs/decisions/*.md
generated_by: scripts/root-topology/build_decision_indexes.py
generated_indexes:
  - docs/decisions/indexes/README.md
  - docs/decisions/indexes/by-number.md
  - docs/decisions/indexes/by-date.md
  - docs/decisions/indexes/by-surface.md
  - docs/decisions/indexes/by-mechanic.md
  - docs/decisions/indexes/by-guard.md
  - docs/decisions/indexes/by-memory-object-class.md
  - docs/decisions/indexes/alias-map.md
  - docs/decisions/indexes/alias-map.min.json
fields:
  decision_id:
    required: true
    pattern: AOA-MEM-D-####
  original_date:
    required: true
    pattern: YYYY-MM-DD
  legacy_path:
    required: true
    pattern: none or docs/decisions/YYYY-MM-DD-*.md
  surface_classes:
    required: true
  mechanic_parents:
    required: true
  guard_families:
    required: true
  memory_object_classes:
    required: true
  posture:
    required: true
dual_addressing:
  path_mode: numbered_canonical
  current_path_authority: numbered decision files are active source files
  canonical_handle: Decision ID
  legacy_path_policy: date-named paths are generated aliases, not live files
  rename_policy: complete; preserve old refs through metadata-backed alias/read-model rows
