name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release_audit:
    name: Repo Validation
    runs-on: ubuntu-latest
    env:
      AOA_AGENTS_ROOT: ${{ github.workspace }}/.deps/aoa-agents
      AOA_EVALS_ROOT: ${{ github.workspace }}/.deps/aoa-evals
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check repository skill home
        uses: 8Dionysus/aoa-skills/.github/actions/home-skill-port@bef949a8324fd3579569c329b9e6c74a2cacc4a5

      - name: Check repo-local KAG index family
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@da9f50a581645b2173b99dbf771a63d447ec2fec
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}

      - name: Checkout abyss-machine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: 726d4d6ea9e8845cbeace7a5a2e3b0640a96c807
          path: .deps/abyss-machine

      - name: Checkout aoa-agents
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-agents
          ref: bf974accbf426a0574c3e63e2c13fef76057e190
          path: .deps/aoa-agents

      - name: Checkout aoa-evals
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-evals
          ref: bf868625bcce22292d128874889d9666ff3a9df8
          path: .deps/aoa-evals

      - name: Checkout aoa-stats
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: cd8b9bd07184be26b12861436f24af60b7e32869
          path: .deps/aoa-stats

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release audit
        run: python scripts/release/release_check.py
